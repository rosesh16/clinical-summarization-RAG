[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chasm-rag"
version = "0.1.0"
description = "Local-first evidence-grounded clinical document summarization"
requires-python = ">=3.10,<3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

